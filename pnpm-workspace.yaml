packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Three days in minutes (3 × 24 × 60).
minimumReleaseAge: 4320
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  '@swc/core': true
  esbuild: true
  rolldown: true
  unrs-resolver: true

overrides:
  semver@6: 7.8.5
  ua-parser-js: '>=2.0.10'
  undici-types: '>=6.28.0'
  i18next: ~26.4.0
  moment: ^2.31.0
  dompurify: ~3.4.14
  '@opentelemetry/core': '>=2.10.0'
  js-cookie: '>=3.0.8'
  serialize-javascript: ~7.1.0
  uuid: '>=11.1.1'
  # Grafana externalizes React Router v6 until its upstream router migration lands:
  # https://github.com/grafana/grafana/issues/129933
  # Keep transitive v6 dependencies aligned with the host runtime.
  'react-router@^6': ^6.30.6

patchedDependencies:
  '@grafana/flamegraph@13.1.0': patches/@grafana__flamegraph@13.1.0.patch
