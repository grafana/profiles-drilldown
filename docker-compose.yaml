services:
  grafana:
    container_name: 'grafana-pyroscope-app'
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.3.0@sha256:96a793a92c9a77cf543d6e5c55100cd296ed9e22487dc3d069331364c456247b}
    ports:
      - ${GRAFANA_PORT:-3000}:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-pyroscope-app
      - ./samples/provisioning:/etc/grafana/provisioning
      - ./samples/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_INSTALL_PLUGINS: grafana-llm-app
      # Grafana 12.3+ preinstalls & auto-updates grafana-pyroscope-app from the catalog,
      # which deletes the ./dist bind mount used for local development. Disable preinstall
      # so the mounted dev build is used.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      OPENAI_API_KEY: $OPENAI_API_KEY
      OPENAI_ORGANIZATION_ID: $OPENAI_ORGANIZATION_ID
      GF_FEATURE_TOGGLES_ENABLE: ${GF_FEATURE_TOGGLES_ENABLE:-metricsFromProfiles,localizationForPlugins}

  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    volumes:
      - qdrant-storage:/qdrant/storage

  pyroscope:
    container_name: 'pyroscope'
    image: grafana/pyroscope:1.20.0@sha256:77b87e1a7ff2c9465951e47444f08b0e434ea651a72a56739f9c9dc676b6246c
    ports:
      - 4100:4100/tcp
    volumes:
      - ./samples/pyroscope:/etc/pyroscope
    environment:
      GITHUB_CLIENT_ID: $GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: $GITHUB_CLIENT_SECRET
      GITHUB_SESSION_SECRET: $GITHUB_SESSION_SECRET

  rideshare:
    build:
      context: ./samples/rideshare
    ports:
      - 5000
    environment:
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4100
      # Set this to 1 to turn on debug logging.
      - DEBUG=0
    deploy:
      mode: replicated
      replicas: 5
    depends_on:
      - pyroscope

  rideshare-load-generator:
    build:
      context: ./samples/rideshare
      dockerfile: Dockerfile.load-generator
    environment:
      - HOST_PREFIX=profiles-drilldown-rideshare
      # This should be the same as the rideshare replica count.
      - REPLICAS=5
      # Set this to 1 to turn on debug logging.
      - DEBUG=0
    depends_on:
      - rideshare
      - pyroscope
    logging:
      driver: none

volumes:
  qdrant-storage:
